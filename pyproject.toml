[project]
name = "hmock"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.11",
    "aio-pika>=9.0",
    "fakeredis>=2.0",
    "jinja2>=3.1",
    "jsonpath-ng>=1.6",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "redis>=5.0",
]

[project.scripts]
omctl = "omctl:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
