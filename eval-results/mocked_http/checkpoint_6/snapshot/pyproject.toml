[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "hmock"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
omctl = "omctl:main"

[tool.setuptools]
py-modules = ["hmock", "omctl"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
